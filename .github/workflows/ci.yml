name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  # 不限定 base 分支 —— 栈式 PR（base 指向另一个特性分支）也应该跑 CI
  pull_request:

jobs:
  check:
    uses: 25-ji-code-de/.github/.github/workflows/static-check.yml@main

  # 本仓此前零测试。第一批盯的是「同一段文本在两条路径上被判成不同的东西」——
  # 渲染器按规范判畸形 token 为纯文本，ui-manager 的正则却把它当 token，
  # 于是屏幕上看得见、复制不出来（见 issue #2）。
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # 无依赖：测试自己搭最小的 window 壳把浏览器脚本跑起来
      - name: Test
        run: node --test "test/*.test.mjs"
