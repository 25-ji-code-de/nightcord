name: Deploy backend

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  deployments: read

# Serialize detection and deployment together so the baseline cannot change
# between them. A queued run compares against the last successful deployment.
concurrency:
  group: nightcord-chat-production
  cancel-in-progress: false

jobs:
  changes:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.changes.outputs.deploy }}
      sha: ${{ steps.changes.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - name: Compare with the last successful backend deployment
        id: changes
        uses: actions/github-script@v7
        with:
          script: |
            await require('./.github/scripts/backend-changes.cjs')({ context, core, github, exec });

  deploy:
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production-backend
      url: https://chat.nightcord.de5.net
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Check deployment credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::Add CLOUDFLARE_API_TOKEN to the repository or production-backend environment secrets.'
            exit 1
          fi
      - run: npm ci
        working-directory: backend
      - name: Apply database migrations and deploy Worker
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOY_SHA: ${{ needs.changes.outputs.sha }}
        run: |
          npx wrangler d1 migrations apply ROOM_DIRECTORY --remote
          npx wrangler deploy --tag "$DEPLOY_SHA"
      - name: Check production health
        # Probe the same production Worker directly: the custom domain can
        # reject GitHub-hosted runners before the request reaches the Worker.
        run: |
          curl --fail --show-error --silent --connect-timeout 10 --max-time 30 \
            --retry 5 --retry-all-errors --retry-delay 5 \
            https://nightcord-chat.houtar.workers.dev/health --output health.json
          node -e "const h = require('./health.json'); if (h.service !== 'nightcord-chat' || h.status !== 'ok') process.exit(1); console.log(h);"
