<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Nightcord demo scene</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="style2.css">
</head>
<body>
<div id="stage">
  <div id="bg"></div><div id="vig"></div>

  <div id="glow"></div>
  <div id="wm"></div>

  <div id="card">
    <img id="card-a" src="../assets/card-chooser.png" alt="">
    <img id="card-b" src="../assets/card-chooser-typed.png" alt="">
    <div id="card-press"></div>
  </div>

  <div id="win"></div>

  <div id="phones"></div>
  <div id="tiles"></div>
  <svg id="lines" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
  <svg id="badge" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
  <div id="mont"></div>

  <div id="cursor">
    <i id="ripple"></i>
    <svg width="34" height="34" viewBox="0 0 34 34" style="position:absolute;left:-2px;top:-2px">
      <path d="M2 2 L2 24 L7.6 18.8 L11.6 28 L15.6 26.3 L11.7 17.3 L19.6 17.1 Z" fill="#111" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
    </svg>
  </div>

  <div id="fade"></div>
</div>
<script src="lib.js"></script>
<script src="wordmark.js"></script>
<script src="data.js"></script>
<script src="build.js"></script>
<script src="render-a.js"></script>
<script src="render-b.js"></script>
<script src="render-c.js"></script>
</body>
</html>
