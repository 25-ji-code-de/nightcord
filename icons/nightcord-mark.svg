<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Nightcord mark — 尺规重绘 v4（光学居中 R/16）

    画布 L = 1024

    ① 构图尺度
       外圆直径 = 2L/3 = 682.667      R = L/3 = 341.333
       （画布边长三等分，取一份为 R）

    ② 光学补偿
       月牙左厚右尖，整体质量重心偏左 7R/36 ≈ 0.194R = 96.7。
       全额补偿会把圆推到明显偏右（右留白仅 74），故只补一小部分：
       圆心自画布中心 O 右移 R/16 = 21.333（占画布 2.08%，约合偏心的 22%）。
       R/16 由四次对分得到，仍在尺规可作范围内。

    ③ 内部构造（全部对分，与 v2 同构，随圆心整体平移）
       P = OB 中点            →  OP = R/2 = 170.667
       E = OP 中点            →  OE = R/4 = 85.333
       内圆 (E, EB)           →  r  = 3R/4 = 256，与圆 O 内切于最右点
       Q = OE 中点            →  OQ = R/8 = 42.667
       眼 (O, OQ) 与 (P, OQ)  →  眼径 R/4 = 85.333，眼距 R/2 = 170.667

    几何校验（画布 x 轴）
       左留白 192.000 | 外圆 682.667 | 右留白 149.333
       内圆右缘 874.667 = 外圆右缘 874.667（内切）
  -->
  <path fill="#ffffff" fill-rule="evenodd" d="
    M874.6667 512 A341.3333 341.3333 0 1 1 192 512 A341.3333 341.3333 0 0 1 874.6667 512 Z
    M874.6667 512 A256 256 0 1 1 362.6667 512 A256 256 0 0 1 874.6667 512 Z
    M576 512 A42.6667 42.6667 0 1 1 490.6667 512 A42.6667 42.6667 0 0 1 576 512 Z
    M746.6667 512 A42.6667 42.6667 0 1 1 661.3333 512 A42.6667 42.6667 0 0 1 746.6667 512 Z"/>
</svg>
