<body>
  <!-- Name Chooser Overlay -->
  <div id="name-chooser" class="name-chooser hidden" role="dialog" aria-modal="true" aria-labelledby="chooser-title" aria-describedby="chooser-subtitle" tabindex="-1">
    <div class="name-chooser-content">
      <div class="logo-area">
        <!-- Nightcord mark：48 整数网格；viewBox 保留现有紧凑留白。 -->
        <svg width="60" height="60" viewBox="8 7 34 34" xmlns="http://www.w3.org/2000/svg">
          <path fill="#ffffff" fill-opacity="0.9" fill-rule="evenodd" d="M41 24A16 16 0 1 1 9 24A16 16 0 1 1 41 24ZM41 24A12 12 0 1 1 17 24A12 12 0 1 1 41 24ZM27 24A2 2 0 1 1 23 24A2 2 0 1 1 27 24ZM35 24A2 2 0 1 1 31 24A2 2 0 1 1 35 24Z"></path>
        </svg>
      </div>
      <h2 id="chooser-title">Nightcord</h2>
      <p id="chooser-subtitle" class="subtitle">请输入你的昵称以加入</p>
      
      <div class="input-wrapper">
        <input type="text" id="name-input" class="name-input" placeholder="昵称" maxlength="32" autocomplete="off" aria-label="昵称" aria-describedby="name-error" aria-invalid="false">
        <div class="input-focus-border"></div>
        <div id="name-error" class="input-error" aria-live="polite"></div>
      </div>
      
      <button id="name-submit" class="name-submit">
        <span id="chooser-submit-text">进入 Nightcord</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>

      <div class="auth-divider sekai-or">
        <span>or</span>
      </div>

      <button id="sekai-pass-login" class="sekai-pass-login">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.11 0 2-.9 2-2V5c0-1.1-.89-2-2-2zm0 16H5V5h14v14zm-7-2h-3v-1h3v1zm5 0h-1v-1h1v1zm0-2h-1v-1h1v1zm0-2h-1v-1h1v1zm0-2h-1v-1h1v1zM8 12c1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3 1.34 3 3 3zm0 1.5c-2.33 0-4.31 1.46-5.11 3.5h10.22c-.8-2.04-2.78-3.5-5.11-3.5z"/>
        </svg>
        <span>使用 SEKAI Pass 登录</span>
      </button>

      <button id="chooser-close" class="chooser-close hidden" title="关闭">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
  </div>
  <div class="chat-root">
    <!-- Sidebar -->
    <div class="sidebar" id="member-sidebar">
      <nav class="navigation-rail" aria-label="主导航">
        <div class="navigation-links">
          <button type="button" class="navigation-item" id="navigation-chat" aria-label="聊天" aria-current="page" aria-controls="messages">
            <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 14 16 2.1 30 14v15.8H19.8V21h-7.6v8.8H2Z"/></svg>
            <span class="navigation-tooltip" aria-hidden="true">聊天</span>
          </button>
          <button type="button" class="navigation-item" aria-label="搜索（暂未开放）" disabled>
            <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><circle cx="14" cy="14" r="11.3"/><path d="m22.1 22.1 6.3 6.3"/></svg>
            <span class="navigation-tooltip" aria-hidden="true">搜索（暂未开放）</span>
          </button>
          <button type="button" class="navigation-item" aria-label="私信（暂未开放）" disabled>
            <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m2.8 2.7 26.6 9.3-11.1 6.2L12 29.4ZM2.8 2.7l15.5 15.5"/></svg>
            <span class="navigation-tooltip" aria-hidden="true">私信（暂未开放）</span>
          </button>
          <button type="button" class="navigation-item" id="navigation-mentions" aria-label="提及成员" aria-controls="mention-picker" aria-expanded="false">
            <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g transform="translate(1.2 1.2) scale(.925)"><path d="M25.85 26.45c-2.5 1.6-5.95 2.85-10.05 2.85-8.15 0-13.6-5.5-13.6-13.2C2.2 8.1 7.9 2.45 15.75 2.45c8.35 0 13.8 5.05 13.8 12.45 0 5.1-1.8 7.1-5.1 7.1-3.2 0-3.85-1.95-3.85-4.7v-6.85m0 5.55c0-3.6-1.9-5.55-5-5.55-3.55 0-5.45 2.4-5.45 5.75 0 3.35 1.85 5.65 5.25 5.65 3.2 0 5.2-2.25 5.2-5.85Z"/></g></svg>
            <span class="navigation-tooltip" aria-hidden="true">提及成员</span>
          </button>
          <button type="button" class="navigation-item" aria-label="收件箱（暂未开放）" disabled>
            <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="1.5" y="5.75" width="29" height="20.5" rx=".8"/><path d="M1.7 6 16 21.1 30.3 6"/></svg>
            <span class="navigation-tooltip" aria-hidden="true">收件箱（暂未开放）</span>
          </button>
          <button type="button" class="navigation-item" id="navigation-members" aria-label="收起成员列表" aria-controls="member-list-panel" aria-expanded="true">
            <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.2 16 16 2.2 29.8 16M2.2 29.8 16 16l13.8 13.8"/></svg>
            <span class="navigation-tooltip" aria-hidden="true">成员列表</span>
          </button>
          <button type="button" class="navigation-item" aria-label="任务（暂未开放）" disabled>
            <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="16" cy="16" r="14.5"/><path d="m10.2 16.4 3.7 5.7 7.7-12.7" stroke-width="1.85"/></svg>
            <span class="navigation-tooltip" aria-hidden="true">任务（暂未开放）</span>
          </button>
          <button type="button" class="navigation-item" aria-label="帮助（暂未开放）" disabled>
            <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" aria-hidden="true"><circle cx="16" cy="16" r="14.5"/><path d="M12.5 12.6c0-4.7 7.4-4.8 7.4-.3 0 3.2-3.9 3.5-3.9 7.6" stroke-width="1.65"/><circle cx="16" cy="22.8" r="1.05" fill="currentColor" stroke="none"/></svg>
            <span class="navigation-tooltip" aria-hidden="true">帮助（暂未开放）</span>
          </button>
          <button type="button" class="navigation-item navigation-settings" id="navigation-settings" aria-label="设置" aria-haspopup="dialog" aria-controls="appearance-settings">
            <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.2 1.5h5.6l.45 3.9 2.15.9 3.15-2.45 3.6 3.6-2.45 3.15.9 2.15 3.9.45v5.6l-3.9.45-.9 2.15 2.45 3.15-3.6 3.6-3.15-2.45-2.15.9-.45 3.9h-5.6l-.45-3.9-2.15-.9-3.15 2.45-3.6-3.6 2.45-3.15-.9-2.15-3.9-.45v-5.6l3.9-.45.9-2.15-2.45-3.15 3.6-3.6 3.15 2.45 2.15-.9Z"/><circle cx="16" cy="16" r="4.5"/></svg>
            <span class="navigation-tooltip" aria-hidden="true">设置</span>
          </button>
        </div>
      </nav>
      <div class="server-header">
        <img class="server-logotype" src="/icons/nightcord-logotype.svg" alt="Nightcord" width="856" height="216">
        <svg class="server-chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="m4 8 8 8 8-8"/>
        </svg>
      </div>
      <div class="sidebar-content" id="member-list-panel">
        <button type="button" class="channel" id="navigation-channel" aria-label="返回聊天">
          <span class="channel-icon"><svg width="24" height="24" viewBox="8 7 34 34" xmlns="http://www.w3.org/2000/svg">
              <path
                d="M41 24A16 16 0 1 1 9 24A16 16 0 1 1 41 24ZM41 24A12 12 0 1 1 17 24A12 12 0 1 1 41 24ZM27 24A2 2 0 1 1 23 24A2 2 0 1 1 27 24ZM35 24A2 2 0 1 1 31 24A2 2 0 1 1 35 24Z"
                fill="white" fill-rule="evenodd"></path>
            </svg></span>
          <span class="channel-name">作业</span>
          <svg class="channel-add" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="currentColor"/><path d="M10 6v8M6 10h8" fill="none" stroke="rgb(var(--nc-selection))" stroke-width="1.5"/></svg>
        </button>
        <div class="section-label" id="online-users-label">
          <svg class="section-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.2 2.6h17.6q.7 0 .8.8l.4 5q0 .8-.8.8h-.9c-1.6-2.6-2.1-3.4-5.8-3.4v12.3q0 1.4 2.4 1.5.9 0 .9.9v.6q0 .7-.8.7H7q-.8 0-.8-.7v-.6q0-.9.9-.9 2.4-.1 2.4-1.5V5.8c-3.7 0-4.2.8-5.8 3.4h-.9q-.8 0-.8-.8l.4-5q.1-.8.8-.8Z"/></svg>
          <span>文字聊天</span>
        </div>
        <div id="online-users" class="member-list" role="group" aria-label="在线成员" aria-labelledby="online-users-label"></div>
        <div class="section-label" id="voice-users-label">
          <svg class="section-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8h6l10-5.5v19L9.5 16h-6Z"/></svg>
          <svg class="section-label-chevron" viewBox="0 0 1366 2048" fill="currentColor" aria-hidden="true" focusable="false"><path d="M1132 1489 272 1921V1772L916 1460V1454L272 1098V948L1132 1430Z"/></svg>
          <span>语音聊天</span>
        </div>
        <div id="voice-users" class="member-list" role="group" aria-labelledby="voice-users-label"></div>
        <div class="section-label" id="offline-users-label">
          <svg class="section-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="m6 18 12-12"/></svg>
          <svg class="section-label-chevron" viewBox="0 0 1366 2048" fill="currentColor" aria-hidden="true" focusable="false"><path d="M1132 1489 272 1921V1772L916 1460V1454L272 1098V948L1132 1430Z"/></svg>
          <span>离线</span>
        </div>
        <div id="offline-users" class="member-list" role="group" aria-labelledby="offline-users-label"></div>
      </div>
      <section class="mention-picker" id="mention-picker" aria-labelledby="mention-picker-title">
        <header class="mention-picker-header">
          <div class="mention-picker-heading">
            <h2 class="mention-picker-title" id="mention-picker-title">提及成员</h2>
            <p class="mention-picker-hint">选中后插入到输入框光标处</p>
          </div>
          <button type="button" class="mention-picker-close" aria-label="关闭提及选择器">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg>
          </button>
        </header>
        <label class="mention-picker-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="7.5"/><path d="m16 16 5 5"/></svg>
          <input type="search" id="mention-picker-query" placeholder="搜索成员" autocomplete="off" aria-label="搜索成员" aria-controls="mention-picker-list">
        </label>
        <div class="mention-picker-list" id="mention-picker-list" role="group" aria-label="成员列表"></div>
      </section>
      <div class="sidebar-account">
        <button type="button" class="sidebar-profile" id="navigation-profile" aria-label="我的资料" aria-haspopup="dialog" disabled>
          <span class="navigation-avatar avatar bg-default" id="navigation-avatar" aria-hidden="true">N</span>
          <span class="sidebar-profile-name" id="navigation-username">未连接</span>
        </button>
        <div class="sidebar-account-actions">
          <span class="sidebar-video-status" role="img" aria-label="摄像头未开启" title="摄像头未开启"><svg viewBox="0 0 28 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 18.5V5.8Q3 3 5.8 3h12.6M10.8 21h7.4q2.8 0 2.8-2.8v-5.6M21 16.3l6 3.5v-13M3 22 25 1"/></svg></span>
          <span class="sidebar-microphone-status" id="navigation-microphone" role="img" aria-label="未加入语音" title="未加入语音">
            <svg class="sidebar-microphone" viewBox="0 0 16 24" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.9 10.65V4.1a3.1 3.1 0 0 1 6.2 0v.6Z" fill="currentColor" stroke="none" class="microphone-capsule-off"/><rect class="microphone-capsule-on" x="4.9" y="1" width="6.2" height="13" rx="3.1" fill="currentColor" stroke="none"/><path class="microphone-support-off" d="M2 9v4.5a6 6 0 0 0 .9 3.2M6 19.15a6 6 0 0 0 8-5.65V9"/><path class="microphone-support-on" d="M2 9v4.5a6 6 0 0 0 12 0V9"/><path d="M8 19.5V23M2 23h12"/><path class="microphone-slash" d="M1 21 15 3"/></svg>
          </span>
          <button type="button" class="sidebar-account-action" id="navigation-profile-info" aria-label="查看个人资料" title="查看个人资料" aria-haspopup="dialog" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7v.5"/></svg></button>
        </div>
      </div>
    </div>
    <!-- Main Chat Area -->
    <button type="button" class="navigation-scrim" aria-label="关闭导航" tabindex="-1" hidden></button>
    <main class="main">
      <div class="chat-header">
        <button type="button" class="sidebar-toggle" aria-label="切换成员列表" aria-controls="member-sidebar" aria-expanded="false">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="channel-icon"><svg width="24" height="24" viewBox="8 7 34 34" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M41 24A16 16 0 1 1 9 24A16 16 0 1 1 41 24ZM41 24A12 12 0 1 1 17 24A12 12 0 1 1 41 24ZM27 24A2 2 0 1 1 23 24A2 2 0 1 1 27 24ZM35 24A2 2 0 1 1 31 24A2 2 0 1 1 35 24Z"
              fill="white" fill-rule="evenodd"></path>
          </svg></div>
        <span id="current-channel-name" style="font-weight:600;">作业</span>
        <span id="connection-status" class="connection-status" role="status" hidden></span>
        <div class="chat-header-actions">
          <div class="voice-toolbar" data-voice-toolbar hidden>
            <button type="button" class="voice-trigger" data-voice-toggle popovertarget="voice-panel" aria-controls="voice-panel" aria-expanded="false" aria-label="打开房间语音面板">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 14v-3a9 9 0 0 1 18 0v3"/><rect x="3" y="12" width="4" height="8" rx="2"/><rect x="17" y="12" width="4" height="8" rx="2"/></svg>
              <span data-voice-label>语音</span>
              <span class="voice-count" data-voice-count hidden>0</span>
              <span class="voice-indicator" aria-hidden="true"></span>
            </button>
            <button type="button" class="voice-quick-mic" data-voice-quick-mic aria-label="取消静音麦克风" title="取消静音麦克风" aria-pressed="false" hidden>
              <svg class="voice-mic-on" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3m-4 0h8"/></svg>
              <svg class="voice-mic-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 3 18 18M9 9v3a3 3 0 0 0 5.1 2.1M9 5a3 3 0 0 1 6 0v4M5 10v2a7 7 0 0 0 12 4.9M19 10v2a7 7 0 0 1-.2 1.8M12 19v3m-4 0h8"/></svg>
            </button>
            <section id="voice-panel" class="voice-panel" popover="auto" role="dialog" aria-labelledby="voice-title">
              <!-- Conference terminal: fixed lamps and keys surround one recessed display. -->
              <div class="voice-housing-header">
                <h2 id="voice-title">房间语音</h2>
                <button type="button" class="voice-close" popovertarget="voice-panel" popovertargetaction="hide" aria-label="收起语音面板" title="收起语音面板">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M6 12h12"/></svg>
                </button>
              </div>
              <div class="voice-hardware-status">
                <span class="voice-lamp" data-voice-line-lamp role="img" aria-label="语音未接通"><i aria-hidden="true"></i>LINE</span>
                <span class="voice-lamp" data-voice-mic-lamp role="img" aria-label="麦克风已关闭"><i aria-hidden="true"></i>MIC</span>
                <span class="voice-housing-signature" aria-hidden="true">NIGHTCORD</span>
              </div>
              <div class="voice-display">
                <div class="voice-screen-stack">
                  <div class="voice-screen voice-screen--call" data-voice-layer="call">
                    <div class="voice-display-header">
                      <div class="voice-display-title">
                        <h3 data-voice-room-title tabindex="-1">聊天</h3>
                        <span class="voice-member-count" data-voice-member-count hidden>0 人</span>
                      </div>
                      <div class="voice-connection" role="status" aria-live="polite">
                        <p class="voice-status" data-voice-status>等待接入</p>
                      </div>
                    </div>
                    <div class="voice-view" data-voice-view="call">
                      <div class="voice-idle" data-voice-idle>
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 14v-3a9 9 0 0 1 18 0v3"/><rect x="3" y="12" width="4" height="8" rx="2"/><rect x="17" y="12" width="4" height="8" rx="2"/></svg>
                        <p>接通后默认为“仅收听”模式<br><span>准备好后，请开启麦克风</span></p>
                      </div>
                      <ul class="voice-members" data-voice-members aria-label="语音成员" hidden></ul>
                      <button type="button" class="voice-screen-link voice-settings" data-voice-settings>
