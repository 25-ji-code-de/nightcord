<html lang="zh-CN" class="world-night">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Nightcord — SEKAI 实时聊天室">
  <meta name="theme-color" content="#50476a">
  <title>Nightcord</title>
  <link rel="stylesheet" href="/vendor/sekai-design/primitives.css">
  <link rel="stylesheet" href="/vendor/sekai-design/contract.css">
  <link rel="stylesheet" href="/vendor/sekai-design/world-system.css">
  <link rel="stylesheet" href="/vendor/sekai-design/world-night.css">
  <link rel="stylesheet" href="/vendor/sekai-design/chat.css">
  <link rel="stylesheet" href="/vendor/sekai-design/modal.css">
  <link rel="stylesheet" href="/css/app-shell.css">
  <link rel="stylesheet" href="/css/renderer.css">
  <link rel="stylesheet" href="/css/notifications.css">
  <link rel="stylesheet" href="/css/image-viewer.css">
  <link rel="stylesheet" href="/css/attachments.css">
</head>

<body>
  <!-- Name Chooser Overlay -->
  <div id="name-chooser" class="name-chooser hidden">
    <div class="name-chooser-content">
      <div class="logo-area">
        <svg width="60" height="60" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M13,10.69v2.72H10.23V10.69Zm3,0v2.69h2.69V10.72ZM23.29,12A11.31,11.31,0,1,1,12,.67,11.31,11.31,0,0,1,23.29,12Zm-.18.07a8.87,8.87,0,1,0-8.87,8.86A8.87,8.87,0,0,0,23.11,12.05Z" fill="#ffffff" fill-opacity="0.9"></path>
        </svg>
      </div>
      <h2 id="chooser-title">Nightcord</h2>
      <p id="chooser-subtitle" class="subtitle">请输入你的昵称以加入</p>
      
      <div class="input-wrapper">
        <input type="text" id="name-input" class="name-input" placeholder="昵称" maxlength="32" autocomplete="off">
        <div class="input-focus-border"></div>
        <div id="name-error" class="input-error"></div>
      </div>
      
      <button id="name-submit" class="name-submit">
        <span id="chooser-submit-text">进入 Nightcord</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>

      <div class="auth-divider sekai-or">
        <span>or</span>
      </div>

      <button id="sekai-pass-login" class="sekai-pass-login">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.11 0 2-.9 2-2V5c0-1.1-.89-2-2-2zm0 16H5V5h14v14zm-7-2h-3v-1h3v1zm5 0h-1v-1h1v1zm0-2h-1v-1h1v1zm0-2h-1v-1h1v1zm0-2h-1v-1h1v1zM8 12c1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3 1.34 3 3 3zm0 1.5c-2.33 0-4.31 1.46-5.11 3.5h10.22c-.8-2.04-2.78-3.5-5.11-3.5z"/>
        </svg>
        <span>使用 SEKAI Pass 登录</span>
      </button>

      <button id="chooser-close" class="chooser-close hidden" title="关闭">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
  </div>
  <div class="chat-root">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="server-header">
        <span>Nightcord</span>
        <span style="font-size:16px;">&#9660;</span>
      </div>
      <div class="sidebar-content">
        <div class="channel">
          <div class="channel-icon"><svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path
                d="M13,10.69v2.72H10.23V10.69Zm3,0v2.69h2.69V10.72ZM23.29,12A11.31,11.31,0,1,1,12,.67,11.31,11.31,0,0,1,23.29,12Zm-.18.07a8.87,8.87,0,1,0-8.87,8.86A8.87,8.87,0,0,0,23.11,12.05Z"
                fill="white"></path>
            </svg></div>
          <span>聊天</span>
        </div>
        <div class="section-label">&gt; 聊天</div>
        <div id="voice-users"></div>
        <div class="section-label">&gt; 离线</div>
      </div>
    </div>
    <!-- Main Chat Area -->
    <div class="main">
      <div class="chat-header">
        <div class="channel-icon"><svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M13,10.69v2.72H10.23V10.69Zm3,0v2.69h2.69V10.72ZM23.29,12A11.31,11.31,0,1,1,12,.67,11.31,11.31,0,0,1,23.29,12Zm-.18.07a8.87,8.87,0,1,0-8.87,8.86A8.87,8.87,0,0,0,23.11,12.05Z"
              fill="white"></path>
          </svg></div>
        <span style="font-weight:600;">聊天</span>
        <div class="window-buttons sekai-window-dots">
          <i class="window-btn blue"></i>
          <i class="window-btn yellow"></i>
          <i class="window-btn red"></i>
        </div>
      </div>
      <div class="messages sekai-messages" id="messages"></div>
      <div class="input-area">
        <div class="input-box">
          <div id="mention-list" class="mention-list hidden"></div>
          <textarea class="input" id="messageInput" placeholder="发送消息" rows="1"></textarea>
          <!-- 隐藏的文件输入 -->
          <input type="file" id="imageInput" accept="image/*" style="display:none;">
          <input type="file" id="musicInput" accept="audio/*" style="display:none;">
          <input type="file" id="fileInput" style="display:none;">
          <div class="input-btns sekai-composer__actions">
            <button class="input-btn" title="@">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10h5v-2h-5c-4.34 0-8-3.66-8-8s3.66-8 8-8 8 3.66 8 8v1.43c0 .79-.71 1.57-1.5 1.57s-1.5-.78-1.5-1.57V12c0-2.76-2.24-5-5-5s-5 2.24-5 5 2.24 5 5 5c1.38 0 2.64-.56 3.54-1.47.65.89 1.77 1.47 2.96 1.47 1.97 0 3.5-1.6 3.5-3.57V12c0-5.52-4.48-10-10-10zm0 13c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3z"/></svg>
            </button>
            <button class="input-btn" title="文本">
              <span style="font-weight:bold;">Aa</span>
            </button>
            <button class="input-btn" title="表情">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"/></svg>
            </button>
            <button class="input-btn" id="attachmentBtn" title="附件">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M6 2c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6H6zm7 7V3.5L18.5 9H13z"/></svg>
            </button>
          </div>
          <!-- 文件上传菜单 -->
          <div id="fileUploadMenu" class="file-upload-menu hidden">
            <button class="file-upload-menu-item" data-type="image">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                <path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/>
              </svg>
              <span>图片</span>
            </button>
            <button class="file-upload-menu-item" data-type="music">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                <path d="M12 3v9.28c-.47-.17-.97-.28-1.5-.28C8.01 12 6 14.01 6 16.5S8.01 21 10.5 21c2.31 0 4.2-1.75 4.45-4H15V6h4V3h-7z"/>
              </svg>
              <span>音乐</span>
            </button>
            <button class="file-upload-menu-item" data-type="file">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                <path d="M6 2c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6H6zm7 7V3.5L18.5 9H13z"/>
              </svg>
              <span>文件</span>
            </button>
          </div>
          <!-- 上传进度条 -->
          <div id="fileUploadProgress" class="file-upload-progress hidden">
            <div class="file-upload-progress-header">
              <div class="file-upload-progress-filename" id="uploadFilename"></div>
              <div class="file-upload-progress-percent" id="uploadPercent">0%</div>
            </div>
            <div class="file-upload-progress-bar">
              <div class="file-upload-progress-fill" id="uploadFill"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
