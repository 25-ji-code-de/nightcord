<html lang="zh-CN" class="world-night">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Nightcord — SEKAI 实时聊天室">
  <meta name="theme-color" content="#50476a">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" sizes="180x180">
  <meta name="application-name" content="Nightcord">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Nightcord">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>Nightcord</title>
  <link rel="stylesheet" href="/vendor/sekai-design/primitives.css">
  <link rel="stylesheet" href="/vendor/sekai-design/contract.css">
  <link rel="stylesheet" href="/vendor/sekai-design/world-system.css">
  <link rel="stylesheet" href="/vendor/sekai-design/world-night.css">
  <link rel="stylesheet" href="/vendor/sekai-design/chat.css">
  <link rel="stylesheet" href="/vendor/sekai-design/modal.css">
  <link rel="stylesheet" href="/css/app-shell.css">
  <link rel="stylesheet" href="/css/renderer.css">
  <link rel="stylesheet" href="/css/notifications.css">
  <link rel="stylesheet" href="/css/image-viewer.css">
  <link rel="stylesheet" href="/css/attachments.css">
  <link rel="stylesheet" href="/css/voice.css">
</head>

<body>
  <!-- Name Chooser Overlay -->
  <div id="name-chooser" class="name-chooser hidden" role="dialog" aria-modal="true" aria-labelledby="chooser-title" aria-describedby="chooser-subtitle" tabindex="-1">
    <div class="name-chooser-content">
      <div class="logo-area">
        <!-- Nightcord mark：48 整数网格；viewBox 保留现有紧凑留白。 -->
        <svg width="60" height="60" viewBox="8 7 34 34" xmlns="http://www.w3.org/2000/svg">
          <path fill="#ffffff" fill-opacity="0.9" fill-rule="evenodd" d="M41 24A16 16 0 1 1 9 24A16 16 0 1 1 41 24ZM41 24A12 12 0 1 1 17 24A12 12 0 1 1 41 24ZM27 24A2 2 0 1 1 23 24A2 2 0 1 1 27 24ZM35 24A2 2 0 1 1 31 24A2 2 0 1 1 35 24Z"></path>
        </svg>
      </div>
      <h2 id="chooser-title">Nightcord</h2>
      <p id="chooser-subtitle" class="subtitle">请输入你的昵称以加入</p>
      
      <div class="input-wrapper">
        <input type="text" id="name-input" class="name-input" placeholder="昵称" maxlength="32" autocomplete="off" aria-label="昵称" aria-describedby="name-error" aria-invalid="false">
        <div class="input-focus-border"></div>
        <div id="name-error" class="input-error" aria-live="polite"></div>
      </div>
      
      <button id="name-submit" class="name-submit">
        <span id="chooser-submit-text">进入 Nightcord</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>

      <div class="auth-divider sekai-or">
        <span>or</span>
      </div>

      <button id="sekai-pass-login" class="sekai-pass-login">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.11 0 2-.9 2-2V5c0-1.1-.89-2-2-2zm0 16H5V5h14v14zm-7-2h-3v-1h3v1zm5 0h-1v-1h1v1zm0-2h-1v-1h1v1zm0-2h-1v-1h1v1zm0-2h-1v-1h1v1zM8 12c1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3 1.34 3 3 3zm0 1.5c-2.33 0-4.31 1.46-5.11 3.5h10.22c-.8-2.04-2.78-3.5-5.11-3.5z"/>
        </svg>
        <span>使用 SEKAI Pass 登录</span>
      </button>

      <button id="chooser-close" class="chooser-close hidden" title="关闭">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
  </div>
  <div class="chat-root">
    <!-- Sidebar -->
    <div class="sidebar" id="member-sidebar">
      <div class="server-header">
        <img class="server-logotype" src="/icons/nightcord-logotype.svg" alt="Nightcord" width="856" height="216">
        <svg class="server-chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="m6 9 6 6 6-6"/>
        </svg>
      </div>
      <div class="sidebar-content">
        <div class="channel">
          <div class="channel-icon"><svg width="24" height="24" viewBox="8 7 34 34" xmlns="http://www.w3.org/2000/svg">
              <path
                d="M41 24A16 16 0 1 1 9 24A16 16 0 1 1 41 24ZM41 24A12 12 0 1 1 17 24A12 12 0 1 1 41 24ZM27 24A2 2 0 1 1 23 24A2 2 0 1 1 27 24ZM35 24A2 2 0 1 1 31 24A2 2 0 1 1 35 24Z"
                fill="white" fill-rule="evenodd"></path>
            </svg></div>
          <span>聊天</span>
        </div>
        <div id="online-users" class="member-list" role="group" aria-label="在线成员"></div>
        <div class="section-label" id="voice-users-label">
          <svg class="section-label-chevron" viewBox="0 0 1366 2048" fill="currentColor" aria-hidden="true" focusable="false"><path d="M1132 1489 272 1921V1772L916 1460V1454L272 1098V948L1132 1430Z"/></svg>
          <span>语音聊天</span>
        </div>
        <div id="voice-users" class="member-list" role="group" aria-labelledby="voice-users-label"></div>
        <div class="section-label" id="offline-users-label">
          <svg class="section-label-chevron" viewBox="0 0 1366 2048" fill="currentColor" aria-hidden="true" focusable="false"><path d="M1132 1489 272 1921V1772L916 1460V1454L272 1098V948L1132 1430Z"/></svg>
          <span>离线</span>
        </div>
        <div id="offline-users" class="member-list" role="group" aria-labelledby="offline-users-label"></div>
      </div>
    </div>
    <!-- Main Chat Area -->
    <main class="main">
      <div class="chat-header">
        <button type="button" class="sidebar-toggle" aria-label="切换成员列表" aria-controls="member-sidebar" aria-expanded="false">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="channel-icon"><svg width="24" height="24" viewBox="8 7 34 34" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M41 24A16 16 0 1 1 9 24A16 16 0 1 1 41 24ZM41 24A12 12 0 1 1 17 24A12 12 0 1 1 41 24ZM27 24A2 2 0 1 1 23 24A2 2 0 1 1 27 24ZM35 24A2 2 0 1 1 31 24A2 2 0 1 1 35 24Z"
              fill="white" fill-rule="evenodd"></path>
          </svg></div>
        <span style="font-weight:600;">聊天</span>
        <span id="connection-status" class="connection-status" role="status" hidden></span>
        <div class="chat-header-actions">
          <div class="voice-toolbar" data-voice-toolbar hidden>
            <button type="button" class="voice-trigger" data-voice-toggle popovertarget="voice-panel" aria-controls="voice-panel" aria-expanded="false" aria-label="打开房间语音面板">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 14v-3a9 9 0 0 1 18 0v3"/><rect x="3" y="12" width="4" height="8" rx="2"/><rect x="17" y="12" width="4" height="8" rx="2"/></svg>
              <span data-voice-label>语音</span>
              <span class="voice-count" data-voice-count hidden>0</span>
              <span class="voice-indicator" aria-hidden="true"></span>
            </button>
            <button type="button" class="voice-quick-mic" data-voice-quick-mic aria-label="取消静音麦克风" title="取消静音麦克风" aria-pressed="false" hidden>
              <svg class="voice-mic-on" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3m-4 0h8"/></svg>
              <svg class="voice-mic-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 3 18 18M9 9v3a3 3 0 0 0 5.1 2.1M9 5a3 3 0 0 1 6 0v4M5 10v2a7 7 0 0 0 12 4.9M19 10v2a7 7 0 0 1-.2 1.8M12 19v3m-4 0h8"/></svg>
            </button>
            <section id="voice-panel" class="voice-panel" popover="auto" role="dialog" aria-labelledby="voice-title">
              <!-- Conference terminal: one display with menus, two fixed call keys. -->
              <div class="voice-housing-header">
                <h2 id="voice-title">房间语音</h2>
                <button type="button" class="voice-close" popovertarget="voice-panel" popovertargetaction="hide" aria-label="收起语音面板" title="收起语音面板">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M6 12h12"/></svg>
                </button>
              </div>
              <div class="voice-display">
                <div class="voice-screen-stack">
                  <div class="voice-screen voice-screen--call" data-voice-layer="call">
                    <div class="voice-display-header">
                      <div class="voice-display-title">
                        <h3 data-voice-room-title tabindex="-1">聊天</h3>
                        <span class="voice-member-count" data-voice-member-count hidden>0 人</span>
                      </div>
                      <div class="voice-connection" role="status" aria-live="polite">
                        <span class="voice-connection-light" aria-hidden="true"></span>
                        <p class="voice-status" data-voice-status>等待接入</p>
                      </div>
                    </div>
                    <div class="voice-view" data-voice-view="call">
                      <div class="voice-idle" data-voice-idle>
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 14v-3a9 9 0 0 1 18 0v3"/><rect x="3" y="12" width="4" height="8" rx="2"/><rect x="17" y="12" width="4" height="8" rx="2"/></svg>
                        <p>接通后默认为“仅收听”模式<br><span>准备好后，请开启麦克风</span></p>
                      </div>
                      <ul class="voice-members" data-voice-members aria-label="语音成员" hidden></ul>
                      <button type="button" class="voice-screen-link voice-settings" data-voice-settings>
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M4 7h2m6 0h8M4 17h8m6 0h2"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/></svg>
                        <span>输入设备</span>
                        <svg class="voice-screen-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
                      </button>
                    </div>
                  </div>
                  <div class="voice-screen voice-screen--menu" data-voice-layer="menu" inert aria-hidden="true">
                    <div class="voice-display-header">
                      <div class="voice-display-title">
                        <button type="button" class="voice-back" data-voice-back aria-label="返回通话">
                          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg>
                        </button>
                        <h3 data-voice-screen-title tabindex="-1">输入设备</h3>
                      </div>
                      <div class="voice-connection" role="status" aria-live="polite">
                        <span class="voice-connection-light" aria-hidden="true"></span>
                        <p class="voice-status" data-voice-menu-status>等待接入</p>
                      </div>
                    </div>
                    <div class="voice-screen-body">
                      <div class="voice-view voice-member-view" data-voice-view="member" hidden>
                        <div class="voice-volume">
                          <label for="voice-member-volume">收听音量</label>
                          <output for="voice-member-volume" data-voice-volume-output aria-hidden="true">100%</output>
                          <input id="voice-member-volume" data-voice-volume type="range" min="0" max="1" step=".05" value="1">
                        </div>
                        <p class="voice-screen-hint">仅调节您听到该成员时的音量。</p>
                      </div>
                      <div class="voice-view voice-device-view" data-voice-view="device" hidden>
                        <label class="voice-device">麦克风<select data-voice-device><option value="">系统默认麦克风</option></select></label>
                        <p class="voice-screen-hint">更换设备后，您需要重新启用麦克风。</p>
                      </div>
                    </div>
                  </div>
                </div>
                <div class="voice-notices" data-voice-notices hidden>
                  <p class="voice-usage-reminder" data-voice-usage-reminder role="status" aria-live="polite" aria-atomic="true" hidden></p>
                  <button type="button" class="voice-screen-link" data-voice-play hidden>启用声音</button>
                  <button type="button" class="voice-screen-link" data-voice-recover hidden>恢复连接</button>
                </div>
              </div>
              <div class="voice-controls">
                <button type="button" class="voice-key voice-key--microphone" data-voice-mic aria-label="取消静音麦克风" aria-pressed="false" disabled>
                  <span class="voice-key-face">
                    <svg class="voice-mic-on" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3m-4 0h8"/></svg>
                    <svg class="voice-mic-off" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 3 18 18M9 9v3a3 3 0 0 0 5.1 2.1M9 5a3 3 0 0 1 6 0v4M5 10v2a7 7 0 0 0 12 4.9M19 10v2a7 7 0 0 1-.2 1.8M12 19v3m-4 0h8"/></svg>
                    <span class="voice-key-light" aria-hidden="true"></span>
                  </span>
                  <span data-voice-mic-label>麦克风</span>
                </button>
                <div class="voice-call-key">
                  <button type="button" class="voice-key voice-key--join" data-voice-join>
                    <span class="voice-key-face">
                      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.12 4.2 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.96.36 1.9.7 2.8a2 2 0 0 1-.45 2.11L8.09 9.9a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.84.58 2.8.7A2 2 0 0 1 22 16.92Z"/></svg>
                    </span>
                    <span data-voice-join-label>接入语音</span>
                  </button>
                  <button type="button" class="voice-key voice-key--leave" data-voice-leave aria-label="结束通话" hidden>
                    <span class="voice-key-face">
                      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 15a12 12 0 0 1 16 0l2-3a2 2 0 0 0-.5-2.7 17 17 0 0 0-19 0A2 2 0 0 0 2 12l2 3Z"/><path d="M7 13v-3m10 3v-3"/></svg>
                    </span>
                    <span data-voice-leave-label>结束通话</span>
                  </button>
                </div>
              </div>
              <div id="voice-audio" aria-hidden="true"></div>
            </section>
          </div>
          <div class="window-buttons sekai-window-dots">
            <i class="window-btn blue"></i>
            <i class="window-btn yellow"></i>
            <i class="window-btn red"></i>
          </div>
        </div>
      </div>
      <div class="messages sekai-messages" id="messages"></div>
      <div class="input-area">
        <div class="input-box">
          <div id="mention-list" class="mention-list hidden"></div>
          <textarea class="input" id="messageInput" placeholder="发送消息" rows="1"></textarea>
          <!-- 隐藏的文件输入 -->
          <input type="file" id="imageInput" accept="image/*" style="display:none;">
          <input type="file" id="musicInput" accept="audio/*" style="display:none;">
          <input type="file" id="fileInput" style="display:none;">
          <div class="input-btns sekai-composer__actions">
            <button class="input-btn" title="@">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10h5v-2h-5c-4.34 0-8-3.66-8-8s3.66-8 8-8 8 3.66 8 8v1.43c0 .79-.71 1.57-1.5 1.57s-1.5-.78-1.5-1.57V12c0-2.76-2.24-5-5-5s-5 2.24-5 5 2.24 5 5 5c1.38 0 2.64-.56 3.54-1.47.65.89 1.77 1.47 2.96 1.47 1.97 0 3.5-1.6 3.5-3.57V12c0-5.52-4.48-10-10-10zm0 13c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3z"/></svg>
            </button>
            <button class="input-btn" title="文本">
              <span style="font-weight:bold;">Aa</span>
            </button>
            <button class="input-btn" title="表情">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"/></svg>
            </button>
            <button class="input-btn" id="attachmentBtn" title="附件">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M6 2c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6H6zm7 7V3.5L18.5 9H13z"/></svg>
            </button>
          </div>
          <!-- 文件上传菜单 -->
          <div id="fileUploadMenu" class="file-upload-menu hidden">
            <button class="file-upload-menu-item" data-type="image">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                <path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/>
              </svg>
              <span>图片</span>
            </button>
            <button class="file-upload-menu-item" data-type="music">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                <path d="M12 3v9.28c-.47-.17-.97-.28-1.5-.28C8.01 12 6 14.01 6 16.5S8.01 21 10.5 21c2.31 0 4.2-1.75 4.45-4H15V6h4V3h-7z"/>
              </svg>
              <span>音乐</span>
            </button>
            <button class="file-upload-menu-item" data-type="file">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                <path d="M6 2c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6H6zm7 7V3.5L18.5 9H13z"/>
              </svg>
              <span>文件</span>
            </button>
          </div>
          <!-- 上传进度条 -->
          <div id="fileUploadProgress" class="file-upload-progress hidden">
            <div class="file-upload-progress-header">
              <div class="file-upload-progress-filename" id="uploadFilename"></div>
              <div class="file-upload-progress-percent" id="uploadPercent">0%</div>
            </div>
            <div class="file-upload-progress-bar">
              <div class="file-upload-progress-fill" id="uploadFill"></div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
